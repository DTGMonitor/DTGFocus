<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Radar line-of-sight sensitivity over a pit slope">
  <defs>
    <linearGradient id="st-slope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4BC4"/>
      <stop offset="100%" stop-color="#3A1E63"/>
    </linearGradient>
    <linearGradient id="st-los" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A6FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C9A6FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="st-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B1147"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#E9D8FF"/>
    </linearGradient>
  </defs>

  <!-- benched pit wall, in section -->
  <path d="M28 168 L28 150 L58 150 L58 128 L88 128 L88 106 L118 106 L118 84 L148 84 L148 62 L214 62 L214 168 Z"
        fill="url(#st-slope)" opacity="0.55"/>
  <path d="M28 168 L28 150 L58 150 L58 128 L88 128 L88 106 L118 106 L118 84 L148 84 L148 62 L214 62"
        fill="none" stroke="#D8C2FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- line-of-sight fan from the sensor to the wall -->
  <g stroke="url(#st-los)" stroke-width="2" stroke-linecap="round">
    <line x1="44" y1="52" x2="150" y2="70"/>
    <line x1="44" y1="52" x2="120" y2="92"/>
    <line x1="44" y1="52" x2="90" y2="114"/>
    <line x1="44" y1="52" x2="60" y2="136"/>
  </g>

  <!-- movement vector at the probed cell: down the steepest line -->
  <g stroke="#19E1C9" stroke-width="3" stroke-linecap="round">
    <line x1="118" y1="90" x2="140" y2="122"/>
    <path d="M132 112 L141 124 L127 124" fill="#19E1C9" stroke="none"/>
  </g>
  <circle cx="118" cy="90" r="4.5" fill="#19E1C9"/>

  <!-- the radar -->
  <g transform="translate(44 52)">
    <circle r="12" fill="#160A26" stroke="#C9A6FF" stroke-width="2.5"/>
    <circle r="4" fill="#C9A6FF"/>
    <g fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round">
      <path d="M13 -9 A 22 22 0 0 1 13 9"/>
      <path d="M20 -13 A 32 32 0 0 1 20 13"/>
    </g>
    <line x1="0" y1="12" x2="0" y2="30" stroke="#C9A6FF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 0..1 sensitivity colour bar -->
  <rect x="28" y="180" width="186" height="8" rx="4" fill="url(#st-bar)"/>
  <text x="28" y="176" font-family="Inter, sans-serif" font-size="10" fill="#A78BDA">0</text>
  <text x="207" y="176" font-family="Inter, sans-serif" font-size="10" fill="#A78BDA">1</text>
</svg>
